[server]
headless = true
maxUploadSize = 20
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#1a5fb4"
textColor = "#1f2328"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"

[theme.dark]
primaryColor = "#58a6ff"
textColor = "#e6edf3"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
